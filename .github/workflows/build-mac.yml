name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-intel-x86-64
            os: macos-13
            arch: x86_64
          - name: macos-applesilicon-arm64
            os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.0" "pywebview>=5.0" "aiohttp>=3.9" "requests>=2.31" "qrcode>=7.4"
          pip install pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-WebKit pyobjc-framework-Quartz

      - name: Build .app (${{ matrix.name }})
        run: |
          pyinstaller --noconfirm --windowed --onefile \
            --name "Aragoz Lite" \
            --icon "aragoz.icns" \
            --add-data "frontend:frontend" \
            --collect-all webview --collect-all aiohttp \
            --hidden-import webview.platforms.cocoa \
            --target-arch ${{ matrix.arch }} \
            main.py
          codesign --force --deep --sign - "dist/Aragoz Lite.app" 2>/dev/null || true

      - name: Package
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Aragoz Lite.app" "../Aragoz Lite ${{ matrix.name }}.zip"
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: "Aragoz Lite ${{ matrix.name }}.zip"
          if-no-files-found: error