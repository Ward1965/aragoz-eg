name: Build Linux

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 gir1.2-gtk-3.0 python3-venv

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.0" "pywebview[gtk]>=5.0" "aiohttp>=3.9" "requests>=2.31" "qrcode>=7.4"

      - name: Build binary
        run: |
          pyinstaller --noconfirm --onefile \
            --name "Aragoz Lite" \
            --add-data "frontend:frontend" \
            --collect-all webview --collect-all aiohttp \
            --hidden-import webview.platforms.gtk \
            main.py

      - name: Package
        run: |
          cp "dist/Aragoz Lite" "Aragoz.Lite.linux-x64"
          gzip -k "Aragoz.Lite.linux-x64"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            Aragoz.Lite.linux-x64*
          if-no-files-found: error